name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب المشروع (Checkout)
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: منح صلاحية التشغيل لـ Gradle Wrapper
        run: chmod +x gradlew

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK (Debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: رفع الملف الناتج كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/outputs/apk/debug/*.apk
